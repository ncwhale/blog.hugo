{{- if or (.Paginator.HasPrev) (.Paginator.HasNext) }}
<nav class="pagination" aria-label="Pagination">
	{{- if .Paginator.HasPrev }}
	<a class="pagination__item pagination__item--prev btn" href="{{ .Paginator.Prev.URL }}" rel="prev">&laquo;</a>
	{{- else }}
	<span class="pagination__item pagination__item--disabled">&laquo;</span>
	{{- end }}
	<span class="pagination__item pagination__item--current">
		{{- .Paginator.PageNumber }} / {{ .Paginator.TotalPages -}}
	</span>
	{{- if .Paginator.HasNext }}
	<a class="pagination__item pagination__item--next btn" href="{{ .Paginator.Next.URL }}" rel="next">&raquo;</a>
	{{- else }}
	<span class="pagination__item pagination__item--disabled">&raquo;</span>
	{{- end }}
</nav>
{{- end }}
