{{- if .Params.tags }}
<div class="post__tags tags">
	<span class="tags__label">{{ T "tags_title" }}</span>
	<ul class="tags__list">
		{{- range .Params.tags }}
		<li class="tags__item">
			<a class="tags__link" href="{{ "tags/" | relLangURL }}{{ . | urlize }}/" rel="tag">#{{ . }}</a>
		</li>
		{{- end }}
	</ul>
</div>
{{- end }}
